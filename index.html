<body class="bg-rose-50 text-gray-800 pb-20">

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- Reusable SVG Icons ---

      Heart: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill={p.fill||"none"} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>,
      Edit3: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>,
      UserPlus: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>,
      CheckCircle2: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"></path><path d="M9 12l2 2 4-4"></path></svg>,
      Circle: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle></svg>,
      DollarSign: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>,
      Download: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>,
      Settings: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>,
      Users: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
    };

    // --- Custom Modal Components ---
    const AlertModal = ({ isOpen, message, onClose }) => {
      if (!isOpen) return null;
      return (
        <div className="fixed inset-0 bg-black/50 z-[100] flex items-center justify-center p-4 backdrop-blur-sm">
          <div className="bg-white rounded-3xl p-6 md:p-8 max-w-sm w-full shadow-2xl animate-fade-in text-center border-4 border-rose-200">
            <div className="text-5xl mb-4">🔔</div>
            <p className="text-xl font-bold text-gray-800 mb-6">{message}</p>
            <button onClick={onClose} className="w-full py-3 rounded-xl bg-rose-500 hover:bg-rose-600 font-bold text-white shadow-md transition text-lg">
              ตกลง
            </button>
          </div>
        </div>
      );
    };

    const ConfirmModal = ({ isOpen, message, onConfirm, onCancel }) => {
      if (!isOpen) return null;
      return (
        <div className="fixed inset-0 bg-black/50 z-[100] flex items-center justify-center p-4 backdrop-blur-sm">
          <div className="bg-white rounded-3xl p-6 md:p-8 max-w-sm w-full shadow-2xl animate-fade-in text-center border-4 border-amber-200">
            <div className="text-5xl mb-4">⚠️</div>
            <p className="text-xl font-bold text-gray-800 mb-6 whitespace-pre-line">{message}</p>
            <div className="flex gap-3">
              <button onClick={onCancel} className="flex-1 py-3 rounded-xl bg-gray-100 hover:bg-gray-200 font-bold text-gray-700 transition">
                ยกเลิก
              </button>
              <button onClick={onConfirm} className="flex-1 py-3 rounded-xl bg-amber-500 hover:bg-amber-600 font-bold text-white shadow-md transition">
                ยืนยัน
              </button>
            </div>
          </div>
        </div>
      );
    };

    // --- Main App Component ---
    const App = () => {
      // Modals State
      const [alertState, setAlertState] = useState({ isOpen: false, message: '' });
      const [confirmState, setConfirmState] = useState({ isOpen: false, message: '', onConfirm: null });

      const showAlert = (message) => setAlertState({ isOpen: true, message });
      const showConfirm = (message, onConfirm) => setConfirmState({ isOpen: true, message, onConfirm });

      // Admin Mode
      const [isAdmin, setIsAdmin] = useState(false);
      const [showLoginModal, setShowLoginModal] = useState(false);
      const [passwordInput, setPasswordInput] = useState('');
      const [loginError, setLoginError] = useState('');

      // Date Management
      const [currentDate, setCurrentDate] = useState(new Date()); 
      const [selectedDate, setSelectedDate] = useState(null); 
      
      // Global Data
      const [teacherName, setTeacherName] = useState('นุ่น');
      const [quote, setQuote] = useState('การเรียนแม้เหนื่อยยาก\nยอมลำบากอย่าท้อถอย\nสุดทางที่รอคอย\nคืออนาคตอันงดงาม');
      const [appIcon, setAppIcon] = useState(null); // Web App Icon
      
      // Group Management
      const [groups, setGroups] = useState([{ id: 1, name: 'กลุ่มทั่วไป' }]);
      const [activeGroupId, setActiveGroupId] = useState(1);
      const [newGroupName, setNewGroupName] = useState('');
      const [batchWeekdays, setBatchWeekdays] = useState([]);

      // All Group Data
      const [groupData, setGroupData] = useState({
        1: {
          students: [
            { id: 1, name: 'ด.ช. สมชาย รักเรียน' },
            { id: 2, name: 'ด.ญ. สมหญิง ขยันดี' }
          ],
          classDays: new Set(),
          attendance: {}, // เปลี่ยนเป็น format: { 'YYYY-MM-DD': { studentId: 'attended' | 'makeup' } }
          payments: {},
          classTime: '10.30 - 12.00 น.',
          dayNotes: {} 
        }
      });

      // Active Group Computed Data
      const activeGroup = groupData[activeGroupId] || {};
      const students = activeGroup.students || [];
      const classDays = activeGroup.classDays || new Set();
      const attendance = activeGroup.attendance || {};
      const payments = activeGroup.payments || {};
      const classTime = activeGroup.classTime || '10.30 - 12.00 น.';
      const dayNotes = activeGroup.dayNotes || {};

      const updateActiveGroupData = (key, value) => {
        setGroupData(prev => ({
          ...prev,
          [activeGroupId]: {
            ...prev[activeGroupId],
            [key]: typeof value === 'function' ? value(prev[activeGroupId][key]) : value
          }
        }));
      };

      const setStudents = (val) => updateActiveGroupData('students', val);
      const setClassDays = (val) => updateActiveGroupData('classDays', val);
      const setAttendance = (val) => updateActiveGroupData('attendance', val);
      const setPayments = (val) => updateActiveGroupData('payments', val);
      const setClassTime = (val) => updateActiveGroupData('classTime', val);
      const setDayNotes = (val) => updateActiveGroupData('dayNotes', val);
      
      // Decorations
      const [headerColor, setHeaderColor] = useState('#ef4444');
      const [teacherNameColor, setTeacherNameColor] = useState('#fde047');
      const [cellColors, setCellColors] = useState({});
      const [customImages, setCustomImages] = useState({ topLeft: null, topRight: null, bottomRight: null, bottomLeft: null });
      const [contactInfo, setContactInfo] = useState({ tel: '0646195645', fb: 'Noon Supanuch', line: 'noon_supanuch' });
      const [newStudentName, setNewStudentName] = useState('');
      const [defaultFee, setDefaultFee] = useState(1500);
      const [cloudStatus, setCloudStatus] = useState('');

      // --- Firebase Cloud Sync (Auto-Save & Load) ---
      useEffect(() => {
        let unsubscribe = null;
        const initFirebase = async () => {
          if (!window.FirebaseLibs) {
             setTimeout(initFirebase, 200);
             return;
          }
          try {
            setCloudStatus('☁️ กำลังเชื่อมต่อ...');
            const configStr = typeof __firebase_config !== 'undefined' ? __firebase_config : null;
            if (!configStr) {
               setCloudStatus('💻 บันทึกในเครื่อง');
               return; 
            }
            const config = JSON.parse(configStr);
            const app = window.FirebaseLibs.initializeApp(config);
            const auth = window.FirebaseLibs.getAuth(app);
            
            if (typeof __initial_auth_token !== 'undefined') {
              await window.FirebaseLibs.signInWithCustomToken(auth, __initial_auth_token);
            } else {
              await window.FirebaseLibs.signInAnonymously(auth);
            }
            
            const db = window.FirebaseLibs.getFirestore(app);
            window._db = db;
            window._userId = auth.currentUser.uid;
            const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
            
            const docRef = window.FirebaseLibs.doc(db, 'artifacts', appId, 'users', window._userId, 'appData', 'mainDoc');
            
            unsubscribe = window.FirebaseLibs.onSnapshot(docRef, (snap) => {
              if (snap.exists() && !window._isWritingToCloud) {
                 const data = snap.data();
                 if (data.groups) setGroups(data.groups);
                 if (data.teacherName) setTeacherName(data.teacherName);
                 if (data.quote) setQuote(data.quote);
                 if (data.contactInfo) setContactInfo(data.contactInfo);
                 if (data.defaultFee) setDefaultFee(data.defaultFee);
                 if (data.groupData) {
                    const parsed = {};
                    for (const k in data.groupData) {
                       parsed[k] = {
                          ...data.groupData[k],
                          classDays: new Set(data.groupData[k].classDays || [])
                       };
                    }
                    setGroupData(parsed);
                 }
                 setCloudStatus('☁️ ข้อมูลล่าสุดแล้ว');
              }
            }, (err) => {
               console.error(err);
               setCloudStatus('⚠️ เชื่อมต่อล้มเหลว');
            });
          } catch(e) {
             console.error(e);
             setCloudStatus('⚠️ เชื่อมต่อล้มเหลว');
          }
        };
        initFirebase();
        return () => { if (unsubscribe) unsubscribe(); };
      }, []);

      // Auto-save เมื่อมีการแก้ไขข้อมูล
      useEffect(() => {
         if (!window._db || !window._userId) return;
         const timer = setTimeout(async () => {
            window._isWritingToCloud = true;
            try {
               setCloudStatus('☁️ กำลังบันทึก...');
               const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
               const docRef = window.FirebaseLibs.doc(window._db, 'artifacts', appId, 'users', window._userId, 'appData', 'mainDoc');
               
               const serializedGroupData = {};
               for (const k in groupData) {
                  serializedGroupData[k] = {
                     ...groupData[k],
                     classDays: Array.from(groupData[k].classDays || [])
                  };
               }
               
               await window.FirebaseLibs.setDoc(docRef, {
                  groups,
                  teacherName,
                  quote,
                  contactInfo,
                  defaultFee,
                  groupData: serializedGroupData,
                  updatedAt: new Date().toISOString()
               }, { merge: true });
               setCloudStatus('☁️ บันทึกเรียบร้อย');
            } catch(e) {
               console.error(e);
               setCloudStatus('⚠️ บันทึกผิดพลาด');
            } finally {
               setTimeout(() => { window._isWritingToCloud = false; }, 500);
            }
         }, 1500); // ดีเลย์ 1.5 วินาที เพื่อไม่ให้บันทึกถี่เกินไป
         return () => clearTimeout(timer);
      }, [groups, groupData, teacherName, quote, contactInfo, defaultFee]);

      // --- Update Web App Icon Dynamic ---
      useEffect(() => {
        if (appIcon) {
          const favicon = document.getElementById('favicon');
          const appleIcon = document.getElementById('apple-touch-icon');
          if (favicon) favicon.href = appIcon;
          if (appleIcon) appleIcon.href = appIcon;
        }
      }, [appIcon]);

      // --- Calendar Data ---
      const monthNames = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
      const dayNamesShort = ["จ", "อ", "พ", "พฤ", "ศ", "ส", "อา"];
      const dayNamesLong = ["จันทร์", "อังคาร", "พุธ", "พฤหัสบดี", "ศุกร์", "เสาร์", "อาทิตย์"];
      const [isMobile, setIsMobile] = useState(window.innerWidth < 768);

      useEffect(() => {
        const handleResize = () => setIsMobile(window.innerWidth < 768);
        window.addEventListener('resize', handleResize);
        return () => window.removeEventListener('resize', handleResize);
      }, []);

      const dayNames = isMobile ? dayNamesShort : dayNamesLong;

      const currentYear = currentDate.getFullYear();
      const currentMonth = currentDate.getMonth();
      const currentMonthKey = `${currentYear}-${currentMonth}`;

      const formatDate = (year, month, day) => {
        return `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      };

      const firstDayOfMonth = new Date(currentYear, currentMonth, 1);
      const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
      const startingDay = (firstDayOfMonth.getDay() + 6) % 7; 

      const calendarCells = [];
      for (let i = 0; i < startingDay; i++) calendarCells.push(null);
      for (let i = 1; i <= daysInMonth; i++) calendarCells.push(i);

      // --- Functions ---
      const handleLogin = (e) => {
        e.preventDefault();
        if (passwordInput === 'Noon@452656') {
          setIsAdmin(true); setShowLoginModal(false); setPasswordInput(''); setLoginError('');
        } else {
          setLoginError('รหัสผ่านไม่ถูกต้องค่ะ ลองใหม่อีกครั้งนะ!');
        }
      };

      const handleAppIconUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const url = URL.createObjectURL(file);
          setAppIcon(url);
          showAlert("อัปเดตไอคอนแอปเรียบร้อยแล้วค่ะ");
        }
      };

      const handleAddStudent = (e) => {
        e.preventDefault();
        if (!isAdmin || newStudentName.trim() === '') return;
        const newId = students.length > 0 ? Math.max(...students.map(s => s.id)) + 1 : 1;

            <div className="px-3 md:px-8 mt-2 pb-2 z-10 relative">
              <div className="bg-rose-50 border-2 md:border-[3px] border-rose-200 rounded-xl md:rounded-2xl p-3 md:p-6 flex flex-col sm:flex-row justify-center items-center gap-3 md:gap-14 text-sm md:text-2xl font-bold text-gray-700">
                 <div>📞 {isAdmin ? <input value={contactInfo.tel} onChange={e=>setContactInfo({...contactInfo,tel:e.target.value})} className="bg-transparent border-b border-gray-400 w-28 md:w-36 text-center text-rose-600"/> : <span className="text-rose-600">{contactInfo.tel}</span>}</div>
                 <div>📘 {isAdmin ? <input value={contactInfo.fb} onChange={e=>setContactInfo({...contactInfo,fb:e.target.value})} className="bg-transparent border-b border-gray-400 w-32 md:w-48 text-center text-blue-600"/> : <span className="text-blue-600">{contactInfo.fb}</span>}</div>
                 <div>📱 {isAdmin ? <input value={contactInfo.line} onChange={e=>setContactInfo({...contactInfo,line:e.target.value})} className="bg-transparent border-b border-gray-400 w-28 md:w-44 text-center text-green-600"/> : <span className="text-green-600">{contactInfo.line}</span>}</div>
              </div>
            </div>
          </div>

          {/* Admin Tools Section */}
          {isAdmin && (
            <div className="max-w-6xl mx-auto mt-6 space-y-6">
              
              {/* Groups & Batch Select */}
              <div className="bg-indigo-50 p-4 md:p-8 rounded-[24px] md:rounded-[32px] border-[3px] border-indigo-200">
                <h3 className="text-xl md:text-2xl font-bold flex items-center gap-2 mb-4 text-indigo-900 border-b-2 border-indigo-200 pb-2"><Icons.UserPlus/> จัดการกลุ่ม และตาราง</h3>
                <div className="flex flex-col md:flex-row gap-4 mb-6">
                  <div className="flex-grow flex gap-2 overflow-x-auto pb-2 custom-scrollbar">
                    {groups.map(g => (
                      <div key={g.id} className={`flex items-center gap-2 px-4 py-2 rounded-xl cursor-pointer border-2 shrink-0 ${g.id===activeGroupId?'bg-indigo-500 text-white border-indigo-600':'bg-white text-gray-600 border-gray-200'}`}>
                        <span onClick={()=>setActiveGroupId(g.id)} className="font-bold text-sm md:text-base">{g.name}</span>
                        {groups.length>1 && <button onClick={()=>handleDeleteGroup(g.id)} className="w-5 h-5 rounded-full bg-black/20 text-white flex items-center justify-center text-xs font-black hover:bg-red-500">×</button>}
                      </div>
                    ))}
                  </div>
                  <div className="flex gap-2 min-w-max">
                    <input type="text" value={newGroupName} onChange={e=>setNewGroupName(e.target.value)} placeholder="ชื่อกลุ่มใหม่" className="px-3 py-2 border-2 rounded-xl text-sm md:text-base w-32 md:w-40" />
                    <button onClick={handleAddGroup} className="bg-indigo-600 text-white px-3 py-2 rounded-xl font-bold text-sm md:text-base">เพิ่มกลุ่ม</button>
                  </div>
                </div>
                <div className="bg-white p-4 rounded-xl border-2 border-indigo-100 flex flex-col md:flex-row items-center gap-4 shadow-sm">
                  <span className="font-bold text-indigo-800 text-sm md:text-base whitespace-nowrap">จัดตารางรวดเดียว:</span>
                  <div className="flex flex-wrap gap-2 justify-center">
                    {dayNamesShort.map((day, idx) => (
                      <button key={day} onClick={()=>{
                        if(batchWeekdays.includes(idx)) setBatchWeekdays(batchWeekdays.filter(d=>d!==idx));
                        else setBatchWeekdays([...batchWeekdays, idx]);
                      }} className={`px-2 md:px-3 py-1 rounded border-2 font-bold text-xs md:text-sm ${batchWeekdays.includes(idx)?'bg-indigo-500 text-white border-indigo-600':'bg-gray-50 border-gray-200'}`}>ทุก {day}</button>
                    ))}
                  </div>
                  <button onClick={applyBatchDays} className="bg-green-500 text-white px-4 py-1.5 rounded-lg font-bold text-sm md:text-base whitespace-nowrap ml-auto w-full md:w-auto hover:bg-green-600">นำไปใช้</button>
                </div>
              </div>

              {/* Students & Attendance */}
              <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <div className="bg-white p-4 md:p-8 rounded-[24px] md:rounded-[32px] border-[3px] border-gray-200 shadow-sm">
                  <h3 className="text-xl md:text-2xl font-bold mb-4 flex items-center gap-2 text-blue-800"><Icons.UserPlus className="text-blue-600"/> รายชื่อนักเรียน</h3>
                  <form onSubmit={handleAddStudent} className="flex gap-2 mb-4">
                    <input type="text" value={newStudentName} onChange={e=>setNewStudentName(e.target.value)} placeholder="ชื่อนักเรียน..." className="flex-grow px-4 py-2 bg-gray-50 border-2 rounded-xl focus:border-blue-400 focus:outline-none font-bold" />
                    <button type="submit" className="bg-blue-600 text-white px-4 py-2 rounded-xl font-bold hover:bg-blue-700">เพิ่ม</button>
                  </form>
                  <div className="space-y-2 max-h-[350px] overflow-y-auto custom-scrollbar pr-2">
                    {students.map((s, i) => (
                      <div key={s.id} className="flex justify-between items-center bg-gray-50 p-3 rounded-xl border-2 hover:border-blue-200">
                        <span className="font-bold text-sm md:text-lg">{i+1}. {s.name}</span>
                        <button onClick={()=>handleRemoveStudent(s.id)} className="text-red-500 p-1 bg-white rounded border hover:bg-red-500 hover:text-white transition"><Icons.Trash2 className="w-5 h-5"/></button>
                      </div>
                    ))}
                  </div>
                </div>

                <div className={`p-4 md:p-8 rounded-[24px] md:rounded-[32px] border-[3px] transition-colors ${selectedDate ? 'bg-white border-green-200 shadow-sm' : 'bg-gray-50 border-gray-200'}`}>
                  <h3 className="text-xl md:text-2xl font-bold mb-4 flex items-center gap-2">
                    <Icons.CheckCircle2 className={selectedDate?"text-green-600":"text-gray-400"}/> เช็คชื่อรายวัน & สถานะ
                  </h3>
                  {!selectedDate ? (
                    <div className="text-center py-10 text-gray-400 font-bold">คลิกเลือกวันที่บนตารางเพื่อเช็คชื่อ หรือเพิ่มข้อความพิเศษ</div>
                  ) : (
                    <div>
                      <div className="font-black text-lg md:text-xl mb-4 bg-blue-50 p-3 rounded-xl text-center text-blue-900 border-2 border-blue-100">
                        {new Date(selectedDate).toLocaleDateString('th-TH', {dateStyle: 'long'})}
                      </div>
                      
                      <div className="flex flex-col sm:flex-row gap-2 mb-4">
                        <button onClick={()=>toggleClassDay(selectedDate)} className={`flex-1 py-2 md:py-3 rounded-xl font-bold flex items-center justify-center gap-2 border-2 shadow-sm ${classDays.has(selectedDate) ? 'bg-red-500 text-white border-red-600' : 'bg-white text-gray-700 border-gray-300'}`}>
                          <Icons.Heart className="w-5 h-5" fill={classDays.has(selectedDate) ? "white" : "none"}/>
                          {classDays.has(selectedDate) ? 'ยกเลิกคลาสเรียน' : 'ตั้งเป็นวันมีเรียน'}
                        </button>
                      </div>

                      {/* ส่วนเพิ่มข้อความในปฏิทินแบบด่วน */}
                      <div className="mb-4 bg-gray-50 p-3 rounded-xl border-2 border-gray-200">
                         <label className="text-sm font-bold text-gray-700 mb-2 block">ข้อความพิเศษในช่องปฏิทิน:</label>
                         <div className="flex flex-col sm:flex-row gap-2 mb-2">
                           <input type="text" value={dayNotes[selectedDate] || ''} onChange={(e) => handleDayNoteChange(selectedDate, e.target.value)} placeholder="พิมพ์ข้อความที่นี่..." className="flex-grow px-3 py-2 border-2 rounded-lg text-sm focus:outline-none focus:border-blue-400 font-bold" />
                         </div>
                         <div className="flex gap-2">
                           <button onClick={()=>handleDayNoteChange(selectedDate, 'เริ่มเรียน')} className="px-2 py-1 bg-green-100 text-green-700 border border-green-300 rounded text-xs font-bold hover:bg-green-200">เริ่มเรียน</button>
                           <button onClick={()=>handleDayNoteChange(selectedDate, 'หยุดเรียน')} className="px-2 py-1 bg-red-100 text-red-700 border border-red-300 rounded text-xs font-bold hover:bg-red-200">หยุดเรียน</button>
                           <button onClick={()=>handleDayNoteChange(selectedDate, 'สอบ')} className="px-2 py-1 bg-purple-100 text-purple-700 border border-purple-300 rounded text-xs font-bold hover:bg-purple-200">สอบ</button>
                           <button onClick={()=>handleDayNoteChange(selectedDate, '')} className="px-2 py-1 bg-gray-200 text-gray-600 border border-gray-300 rounded text-xs font-bold hover:bg-gray-300">ลบข้อความ</button>
                         </div>
                      </div>

                      {classDays.has(selectedDate) && (
                        <div className="space-y-3 max-h-[300px] overflow-y-auto custom-scrollbar pr-2 bg-green-50 p-3 rounded-xl border-2 border-green-100">
                          <p className="font-bold text-green-800 text-sm">สถานะการเรียน</p>
                          {students.map(s => {
                            const attStatus = (attendance[selectedDate] || {})[s.id]; // 'attended', 'makeup', or undefined
                            return (
                              <div key={s.id} className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 p-3 rounded-xl bg-white border-2 border-gray-200">
                                <span className={`font-bold text-sm md:text-base ${attStatus==='attended'?'text-green-600':attStatus==='makeup'?'text-blue-500':''}`}>{s.name}</span>
                                <div className="flex gap-1 bg-gray-100 p-1 rounded-lg">
                                  <button onClick={()=>setStudentAttendanceStatus(selectedDate, s.id, 'attended')} className={`px-2 py-1 md:px-3 md:py-1 rounded text-xs md:text-sm font-bold transition-colors ${attStatus==='attended'?'bg-green-500 text-white shadow':'text-gray-500 hover:bg-gray-200'}`}>✅ มาเรียน</button>
                                  <button onClick={()=>setStudentAttendanceStatus(selectedDate, s.id, 'makeup')} className={`px-2 py-1 md:px-3 md:py-1 rounded text-xs md:text-sm font-bold transition-colors ${attStatus==='makeup'?'bg-blue-500 text-white shadow':'text-gray-500 hover:bg-gray-200'}`}>📘 ชดเชย</button>
                                  <button onClick={()=>setStudentAttendanceStatus(selectedDate, s.id, null)} className={`px-2 py-1 md:px-3 md:py-1 rounded text-xs md:text-sm font-bold transition-colors ${!attStatus?'bg-red-400 text-white shadow':'text-gray-500 hover:bg-gray-200'}`}>❌ ขาด</button>
                                </div>
                              </div>
                            )
                          })}
                        </div>
                      )}
                    </div>
                  )}
                </div>
              </div>

              {/* Payments & Revenue Summary */}
              <div className="bg-amber-50 p-4 md:p-8 rounded-[24px] md:rounded-[32px] border-[3px] border-amber-200 flex flex-col lg:flex-row gap-6">
                
                {/* Revenue Dashboard */}
                <div className="w-full lg:w-1/3 bg-white p-4 md:p-6 rounded-2xl border-2 border-amber-300 shadow-sm flex flex-col justify-center">
                   <h4 className="text-xl font-black text-amber-800 mb-4 border-b-2 border-amber-100 pb-2 text-center">📊 สรุปรายรับแอดมิน</h4>
                   
                   <div className="bg-gray-50 p-3 rounded-xl mb-3 border border-gray-200 flex justify-between items-center">
                     <span className="font-bold text-gray-600 text-sm">ยอดรวมที่ต้องได้:</span>
                     <span className="font-black text-gray-800 text-lg">฿{totalExpectedRevenue.toLocaleString()}</span>
                   </div>
                   
                   <div className="bg-green-50 p-3 rounded-xl mb-3 border border-green-200 flex justify-between items-center">
                     <span className="font-bold text-green-700 text-sm">เก็บเงินแล้ว (จ่ายแล้ว):</span>
                     <span className="font-black text-green-700 text-2xl">฿{totalCollectedRevenue.toLocaleString()}</span>
                   </div>
                   
                   <div className="bg-red-50 p-3 rounded-xl border border-red-200 flex justify-between items-center">
                     <span className="font-bold text-red-600 text-sm">ยอดรอชำระ (ค้างจ่าย):</span>
                     <span className="font-black text-red-600 text-lg">฿{totalPendingRevenue.toLocaleString()}</span>
                   </div>
                </div>

                {/* Table part */}
                <div className="w-full lg:w-2/3 overflow-x-auto">
                  <div className="flex flex-col sm:flex-row justify-between items-center mb-4 gap-4">
                    <h3 className="text-xl md:text-2xl font-bold flex items-center gap-2 text-amber-900"><Icons.DollarSign/> ระบบค่าเรียน</h3>
                    <div className="flex gap-2">
                      <div className="bg-white px-3 py-1.5 rounded-xl border-2 border-amber-200 flex items-center gap-2">
                        <span className="font-bold text-sm">ค่าเรียน/คน:</span>
                        <input type="number" value={defaultFee} onChange={e=>setDefaultFee(Number(e.target.value))} className="w-16 font-bold text-center border-b focus:outline-none" />
                      </div>
                      <button onClick={handleExportCSV} className="bg-emerald-500 text-white px-3 py-1.5 rounded-xl font-bold flex items-center gap-1 hover:bg-emerald-600"><Icons.Download className="w-4 h-4"/> CSV</button>
                    </div>
                  </div>
                  
                  <table className="w-full min-w-[450px] border-collapse bg-white rounded-xl overflow-hidden border-2 border-amber-200 text-sm md:text-base shadow-sm">
                    <thead className="bg-amber-100 text-amber-900">
                      <tr><th className="p-3 text-center w-12">ลำดับ</th><th className="p-3 text-left">ชื่อ</th><th className="p-3 text-center w-32">สถานะ</th><th className="p-3 text-center w-28">จำนวนเงิน</th></tr>
                    </thead>
                    <tbody>
                      {students.map((s, idx) => {
                        const data = (payments[currentMonthKey]||{})[s.id] || {status:'pending', amount:defaultFee};
                        const updatePay = (field, val) => {
                          const mData = payments[currentMonthKey]||{};
                          setPayments({...payments, [currentMonthKey]:{...mData, [s.id]:{...data, [field]:val}}});
                        };
                        return (
                          <tr key={s.id} className="border-b border-gray-100 hover:bg-amber-50/30 transition">
                            <td className="p-3 text-center font-bold text-gray-500">{idx+1}</td>
                            <td className="p-3 font-bold text-gray-800">{s.name}</td>
                            <td className="p-3 text-center">
                              <select value={data.status} onChange={e=>updatePay('status',e.target.value)} className={`p-1.5 md:p-2 rounded-lg font-bold border-2 text-xs md:text-sm w-full outline-none ${data.status==='before'?'bg-green-100 border-green-300 text-green-800':data.status==='after'?'bg-blue-100 border-blue-300 text-blue-800':'bg-red-50 border-red-200 text-red-600'}`}>
                                <option value="pending">⏳ รอชำระ</option><option value="before">✅ ก่อนเรียน</option><option value="after">☑️ หลังเรียน</option>
                              </select>
                            </td>
                            <td className="p-3 text-center">
                              <input type="number" value={data.amount} onChange={e=>updatePay('amount',e.target.value)} disabled={data.status==='pending'} className={`w-full p-1.5 rounded-lg text-center font-bold border-2 outline-none ${data.status==='pending'?'bg-gray-100 text-gray-400':'bg-white border-amber-300 text-amber-800'}`} />
                            </td>
                          </tr>
                        )
                      })}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          )}

          {/* Stats Summary */}
          <div className="max-w-6xl mx-auto mt-6 bg-gradient-to-br from-pink-100 to-rose-100 p-6 md:p-10 rounded-[32px] md:rounded-[40px] shadow-lg border-[4px] md:border-[6px] border-white relative overflow-hidden">
             <h3 className="text-2xl md:text-3xl font-black mb-6 text-rose-800 text-center flex flex-col md:flex-row items-center justify-center gap-3">
               <span className="bg-white p-2 rounded-2xl shadow-sm transform -rotate-6 text-3xl">🏆</span> 
               สรุปการมาเรียน เดือน{monthNames[currentMonth]}
             </h3>
             {totalClassDaysThisMonth === 0 ? (
               <div className="text-center bg-white/60 p-8 rounded-3xl"><p className="text-xl font-bold text-rose-600">ยังไม่มีการจัดตารางเรียนเดือนนี้ค่ะ</p></div>
             ) : (
               <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                 {studentStats.map(stat => (
                   <div key={stat.id} className="bg-white p-4 md:p-6 rounded-[24px] shadow-sm border-[3px] border-rose-100 flex flex-col h-full hover:shadow-md transition">
                     <div className="font-bold text-gray-800 text-lg md:text-xl mb-4 flex justify-between">
                        <span>{stat.name}</span>
                        <span>{stat.missed===0?'🌟':''}</span>
                     </div>
                     <div className="bg-rose-50 rounded-xl p-3 mb-4">
                       <div className="flex justify-between items-end mb-2 text-sm md:text-base">
                         <span className="font-bold text-gray-500">รวมเข้าเรียนแล้ว</span>
                         <span className="font-black text-rose-600 text-xl">{stat.attended + stat.makeup}<span className="text-gray-400 text-sm">/{totalClassDaysThisMonth}</span></span>
                       </div>
                       <div className="w-full bg-gray-200 rounded-full h-3 flex overflow-hidden">
                          <div className="bg-green-400 h-full transition-all" style={{width: `${(stat.attended/totalClassDaysThisMonth)*100}%`}}></div>
                          <div className="bg-blue-400 h-full transition-all" style={{width: `${(stat.makeup/totalClassDaysThisMonth)*100}%`}}></div>
                       </div>
                       <div className="flex gap-3 justify-center mt-3 text-xs font-bold text-gray-600 bg-white p-2 rounded-lg border border-gray-200">
                          <span>✅ มา: {stat.attended}</span>
                          <span>📘 ชดเชย: {stat.makeup}</span>
                          <span className={stat.missed > 0 ? "text-red-500" : ""}>❌ ขาด: {stat.missed}</span>
                       </div>
                     </div>
                     <div className="mt-auto text-center font-bold text-sm md:text-base">
                       {stat.missed === 0 ? <span className="text-green-600 bg-green-50 px-3 py-1.5 rounded-lg border border-green-200">มาครบ 100% เก่งมาก!</span> : <span className="text-red-500 bg-red-50 px-3 py-1.5 rounded-lg border border-red-200">ขาดเรียนไป {stat.missed} วัน</span>}
                     </div>
                   </div>
                 ))}
               </div>
             )}
          </div>

        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
