<body class="bg-rose-50 text-gray-800 pb-20 overflow-x-hidden">

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- Reusable SVG Icons ---
    const Icons = {

      ChevronLeft: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>,
      ChevronRight: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>,
      Image: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>,
      Palette: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="13.5" cy="6.5" r=".5" fill="currentColor"></circle><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"></circle><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"></circle><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"></circle><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"></path></svg>,
      Trash2: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>,
      Heart: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill={p.fill||"none"} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>,
      Edit3: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>,
      UserPlus: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>,
      CheckCircle2: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"></path><path d="M9 12l2 2 4-4"></path></svg>,
      Circle: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle></svg>,
      DollarSign: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>,
      Download: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>,
      Settings: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>,
      Users: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
    };

    // --- Custom Modal Components ---
    const AlertModal = ({ isOpen, message, onClose }) => {
      if (!isOpen) return null;
      return (
        <div className="fixed inset-0 bg-black/50 z-[100] flex items-center justify-center p-4 backdrop-blur-sm">
          <div className="bg-white rounded-3xl p-6 md:p-8 max-w-sm w-full shadow-2xl animate-fade-in text-center border-4 border-rose-200">
            <div className="text-5xl mb-4">🔔</div>
            <p className="text-xl font-bold text-gray-800 mb-6">{message}</p>
            <button onClick={onClose} className="w-full py-3 rounded-xl bg-rose-500 hover:bg-rose-600 font-bold text-white shadow-md transition text-lg">
              ตกลง
            </button>
          </div>
        </div>
      );
    };

    const ConfirmModal = ({ isOpen, message, onConfirm, onCancel }) => {
      if (!isOpen) return null;
      return (
        <div className="fixed inset-0 bg-black/50 z-[100] flex items-center justify-center p-4 backdrop-blur-sm">
          <div className="bg-white rounded-3xl p-6 md:p-8 max-w-sm w-full shadow-2xl animate-fade-in text-center border-4 border-amber-200">
            <div className="text-5xl mb-4">⚠️</div>
            <p className="text-xl font-bold text-gray-800 mb-6 whitespace-pre-line">{message}</p>
            <div className="flex gap-3">
              <button onClick={onCancel} className="flex-1 py-3 rounded-xl bg-gray-100 hover:bg-gray-200 font-bold text-gray-700 transition">
                ยกเลิก
              </button>
              <button onClick={onConfirm} className="flex-1 py-3 rounded-xl bg-amber-500 hover:bg-amber-600 font-bold text-white shadow-md transition">
                ยืนยัน
              </button>
            </div>
          </div>
        </div>
      );
    };

    // --- Main App Component ---
    const App = () => {
      // Modals State
      const [alertState, setAlertState] = useState({ isOpen: false, message: '' });
      const [confirmState, setConfirmState] = useState({ isOpen: false, message: '', onConfirm: null });

      const showAlert = (message) => setAlertState({ isOpen: true, message });
      const showConfirm = (message, onConfirm) => setConfirmState({ isOpen: true, message, onConfirm });

      // Admin Mode
      const [isAdmin, setIsAdmin] = useState(false);
      const [showLoginModal, setShowLoginModal] = useState(false);
      const [passwordInput, setPasswordInput] = useState('');
      const [loginError, setLoginError] = useState('');

      // Date Management
      const [currentDate, setCurrentDate] = useState(new Date()); 
      const [selectedDate, setSelectedDate] = useState(null); 
      
      // Global Data
      const [teacherName, setTeacherName] = useState('นุ่น');
      const [quote, setQuote] = useState('การเรียนแม้เหนื่อยยาก\nยอมลำบากอย่าท้อถอย\nสุดทางที่รอคอย\nคืออนาคตอันงดงาม');
      const [appIcon, setAppIcon] = useState(null); // Web App Icon (Base64)
      
      // Group Management
      const [groups, setGroups] = useState([{ id: 1, name: 'กลุ่มทั่วไป' }]);
      const [activeGroupId, setActiveGroupId] = useState(1);
      const [newGroupName, setNewGroupName] = useState('');
      const [batchWeekdays, setBatchWeekdays] = useState([]);

      // All Group Data
      const [groupData, setGroupData] = useState({
        1: {
          students: [
            { id: 1, name: 'ด.ช. สมชาย รักเรียน' },
            { id: 2, name: 'ด.ญ. สมหญิง ขยันดี' }
          ],
          classDays: new Set(),
          attendance: {},
          payments: {},
          classTime: '10.30 - 12.00 น.',
          dayNotes: {} 
        }
      });

      // Active Group Computed Data
      const activeGroup = groupData[activeGroupId] || {};
      const students = activeGroup.students || [];
      const classDays = activeGroup.classDays || new Set();
      const attendance = activeGroup.attendance || {};
      const payments = activeGroup.payments || {};
      const classTime = activeGroup.classTime || '10.30 - 12.00 น.';
      const dayNotes = activeGroup.dayNotes || {};

      const updateActiveGroupData = (key, value) => {
        setGroupData(prev => ({
          ...prev,
          [activeGroupId]: {
            ...prev[activeGroupId],
            [key]: typeof value === 'function' ? value(prev[activeGroupId][key]) : value
          }
        }));
      };

      const setStudents = (val) => updateActiveGroupData('students', val);
      const setClassDays = (val) => updateActiveGroupData('classDays', val);
      const setAttendance = (val) => updateActiveGroupData('attendance', val);
      const setPayments = (val) => updateActiveGroupData('payments', val);
      const setClassTime = (val) => updateActiveGroupData('classTime', val);
      const setDayNotes = (val) => updateActiveGroupData('dayNotes', val);
      
      // Decorations
      const [headerColor, setHeaderColor] = useState('#ef4444');
      const [teacherNameColor, setTeacherNameColor] = useState('#fde047');
      const [cellColors, setCellColors] = useState({});
      const [customImages, setCustomImages] = useState({ topLeft: null, topRight: null, bottomRight: null, bottomLeft: null });
      const [contactInfo, setContactInfo] = useState({ tel: '0646195645', fb: 'Noon Supanuch', line: 'noon_supanuch' });
      const [newStudentName, setNewStudentName] = useState('');
      const [defaultFee, setDefaultFee] = useState(1500);
      const [cloudStatus, setCloudStatus] = useState('');

      // --- Google Sheets Sync (Auto-Save & Load) ---
      const GAS_URL = window.GAS_WEB_APP_URL;

      // โหลดข้อมูลเริ่มต้นเมื่อเปิดเว็บ
      useEffect(() => {
        if (!GAS_URL || GAS_URL === "YOUR_GOOGLE_APPS_SCRIPT_URL_HERE") {
          setCloudStatus('💻 ใช้งานออฟไลน์ (ยังไม่ได้เชื่อม Google Sheets)');
          return;
        }

        const loadData = async () => {
          try {
            setCloudStatus('☁️ กำลังเชื่อมต่อ Sheets...');
            const response = await fetch(GAS_URL);
            const data = await response.json();
            
            if (data && Object.keys(data).length > 0) {
               if (data.groups) setGroups(data.groups);
               if (data.teacherName) setTeacherName(data.teacherName);
               if (data.quote) setQuote(data.quote);
               if (data.contactInfo) setContactInfo(data.contactInfo);
               if (data.defaultFee) setDefaultFee(data.defaultFee);
               if (data.appIcon) setAppIcon(data.appIcon);
               if (data.customImages) setCustomImages(data.customImages);
               if (data.groupData) {
                  const parsed = {};
                  for (const k in data.groupData) {
                     parsed[k] = {
                        ...data.groupData[k],
                        classDays: new Set(data.groupData[k].classDays || [])
                     };
                  }
                  setGroupData(parsed);
               }
               setCloudStatus('☁️ ข้อมูลล่าสุดแล้ว');
            } else {
               setCloudStatus('☁️ ตารางใหม่พร้อมใช้งาน');
            }
          } catch(e) {
             console.error(e);
             setCloudStatus('⚠️ เชื่อมต่อ Sheets ล้มเหลว');
          }
        };
        
        loadData();
        
        // ให้หน้าเว็บของผู้ปกครอง (ไม่ใช่แอดมิน) ดึงข้อมูลอัปเดตทุกๆ 15 วินาที
        let interval;
        if (!isAdmin) {
           interval = setInterval(loadData, 15000);
        }
        return () => { if (interval) clearInterval(interval); };
      }, [isAdmin]);

      // Auto-save บันทึกข้อมูลอัตโนมัติเมื่อแอดมินแก้ไขข้อมูล
      useEffect(() => {
         if (!GAS_URL || GAS_URL === "YOUR_GOOGLE_APPS_SCRIPT_URL_HERE") return;
         if (!isAdmin) return; // เฉพาะแอดมินเท่านั้นที่จะเป็นคนเขียนทับข้อมูลลง Google Sheets
         
         const timer = setTimeout(async () => {
            try {
               setCloudStatus('☁️ กำลังบันทึก...');
               
               const serializedGroupData = {};
               for (const k in groupData) {
                  serializedGroupData[k] = {
                     ...groupData[k],
                     classDays: Array.from(groupData[k].classDays || [])
                  };
               }
               
               const payload = {
                  groups,
                  teacherName,
                  quote,
                  contactInfo,
                  defaultFee,
                  appIcon,
                  customImages,
                  groupData: serializedGroupData,
                  updatedAt: new Date().toISOString()
               };

               // ส่งข้อมูลด้วย POST (ใช้ text/plain เพื่อป้องกันปัญหา Cross-Origin CORS ของ Google)
               await fetch(GAS_URL, {
                 method: 'POST',
                 headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                 body: JSON.stringify(payload)
               });
               
               setCloudStatus('☁️ บันทึกเรียบร้อย');
            } catch(e) {
               console.error(e);
               setCloudStatus('⚠️ บันทึกผิดพลาด');
            }
         }, 1500); // ดีเลย์ 1.5 วินาทีเพื่อไม่ให้ส่งรัวเกินไปเวลาพิมพ์
         
         return () => clearTimeout(timer);
      }, [groups, groupData, teacherName, quote, contactInfo, defaultFee, appIcon, customImages, isAdmin]);

      // --- Dynamic Web App Manifest & Icon Update (PWA) ---
      useEffect(() => {
        const iconUrl = appIcon || 'https://placehold.co/192x192/ef4444/white?text=App';
        
        // 1. Update HTML Head tags
        const favicon = document.getElementById('favicon');
        const appleIcon = document.getElementById('apple-touch-icon');
        if (favicon) favicon.href = iconUrl;
        if (appleIcon) appleIcon.href = iconUrl;

        // 2. Generate and inject manifest.json dynamically
        const manifest = {
          name: `ตารางเรียนครู${teacherName}`,
          short_name: "ตารางเรียน",
          start_url: ".",
          display: "standalone",
          background_color: "#fff1f2",
          theme_color: "#ef4444",
          icons: [
            {
              src: iconUrl,
              sizes: "192x192",
              type: "image/png"
            },
            {
              src: iconUrl,
              sizes: "512x512",
              type: "image/png"
            }
          ]
        };

        const stringManifest = JSON.stringify(manifest);
        const blob = new Blob([stringManifest], { type: 'application/json' });
        const manifestURL = URL.createObjectURL(blob);

        let manifestLink = document.getElementById('dynamic-manifest');
        if (!manifestLink) {
          manifestLink = document.createElement('link');
          manifestLink.id = 'dynamic-manifest';
          manifestLink.rel = 'manifest';
          document.head.appendChild(manifestLink);
        }
        manifestLink.href = manifestURL;

      }, [appIcon, teacherName]); // ทำงานใหม่เมื่อไอคอนหรือชื่อครูเปลี่ยน

      // --- Calendar Data ---
      const monthNames = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
      const dayNamesShort = ["จ", "อ", "พ", "พฤ", "ศ", "ส", "อา"];
      const dayNamesLong = ["จันทร์", "อังคาร", "พุธ", "พฤหัสบดี", "ศุกร์", "เสาร์", "อาทิตย์"];
      const [isMobile, setIsMobile] = useState(window.innerWidth < 768);

      useEffect(() => {
        const handleResize = () => setIsMobile(window.innerWidth < 768);
        window.addEventListener('resize', handleResize);
        return () => window.removeEventListener('resize', handleResize);
      }, []);

      const dayNames = isMobile ? dayNamesShort : dayNamesLong;

      const currentYear = currentDate.getFullYear();
      const currentMonth = currentDate.getMonth();
      const currentMonthKey = `${currentYear}-${currentMonth}`;

      const formatDate = (year, month, day) => {
        return `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      };

      const firstDayOfMonth = new Date(currentYear, currentMonth, 1);
      const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();

      const handleCustomImageUpload = (e, positionKey) => {

          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');

            const MAX_SIZE = 400;
            let width = img.width;
            let height = img.height;
            if (width > height && width > MAX_SIZE) {
              height *= MAX_SIZE / width;
              width = MAX_SIZE;
            } else if (height > MAX_SIZE) {
              width *= MAX_SIZE / height;
              height = MAX_SIZE;
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            // แปลงเป็นภาพ PNG คงความโปร่งใส
            const dataUrl = canvas.toDataURL('image/png', 0.8);

          };
          img.src = event.target.result;

                  <h3 className="text-lg md:text-2xl font-bold flex items-center gap-2 text-amber-900"><Icons.DollarSign className="w-5 h-5 md:w-6 md:h-6"/> สถานะค่าเรียน เดือน{monthNames[currentMonth]}</h3>
                  {isAdmin && (
                    <div className="flex flex-wrap justify-center gap-2 w-full sm:w-auto">
                      <div className="bg-white px-3 py-1.5 rounded-xl border-2 border-amber-200 flex items-center gap-2">
                        <span className="font-bold text-xs md:text-sm">ค่าเรียนเริ่มต้น:</span>
                        <input type="number" value={defaultFee} onChange={e=>setDefaultFee(Number(e.target.value))} className="w-12 md:w-16 font-bold text-center border-b focus:outline-none text-sm md:text-base" />
                      </div>
                      <button onClick={handleExportCSV} className="bg-emerald-500 text-white px-3 py-1.5 rounded-xl font-bold flex items-center gap-1 hover:bg-emerald-600 text-sm md:text-base"><Icons.Download className="w-4 h-4"/> CSV</button>
                    </div>
                  )}
                </div>
                
                {/* เพิ่ม container เพื่อกันตารางทะลุหน้าจอมือถือ */}
                <div className="w-full overflow-x-auto pb-2 custom-scrollbar border-2 border-amber-200 rounded-xl shadow-sm">
                  <table className="w-full min-w-[350px] border-collapse bg-white text-xs md:text-base">
                    <thead className="bg-amber-100 text-amber-900">
                      <tr>
                        <th className="p-2 md:p-3 text-center w-10 md:w-12">ที่</th>
                        <th className="p-2 md:p-3 text-left">ชื่อ</th>
                        <th className="p-2 md:p-3 text-center w-28 md:w-32">สถานะ</th>
                        {isAdmin && <th className="p-2 md:p-3 text-center w-24 md:w-28">ยอดเงิน</th>}
                      </tr>
                    </thead>
                    <tbody>
                      {students.map((s, idx) => {
                        const sFee = s.fee || defaultFee;
                        const data = (payments[currentMonthKey]||{})[s.id] || {status:'pending', amount:sFee};
                        const updatePay = (field, val) => {
                          const mData = payments[currentMonthKey]||{};
                          setPayments({...payments, [currentMonthKey]:{...mData, [s.id]:{...data, [field]:val}}});
                        };
                        return (
                          <tr key={s.id} className="border-b border-gray-100 hover:bg-amber-50/30 transition">
                            <td className="p-2 md:p-3 text-center font-bold text-gray-500">{idx+1}</td>
                            <td className="p-2 md:p-3 font-bold text-gray-800">{s.name}</td>
                            <td className="p-2 md:p-3 text-center">
                              {isAdmin ? (
                                <select value={data.status} onChange={e=>updatePay('status',e.target.value)} className={`p-1 md:p-2 rounded-lg font-bold border-2 text-[10px] md:text-sm w-full outline-none ${data.status==='before'?'bg-green-100 border-green-300 text-green-800':data.status==='after'?'bg-blue-100 border-blue-300 text-blue-800':'bg-red-50 border-red-200 text-red-600'}`}>
                                  <option value="pending">⏳ รอชำระ</option><option value="before">✅ ก่อนเรียน</option><option value="after">☑️ หลังเรียน</option>
                                </select>
                              ) : (
                                <span className={`inline-block px-2 py-1 rounded-lg text-[10px] md:text-xs font-bold border ${data.status==='before' || data.status==='after' ? 'bg-green-100 border-green-300 text-green-800' : 'bg-red-50 border-red-200 text-red-600'}`}>
                                  {data.status==='pending' ? '⏳ รอชำระ' : '✅ ชำระแล้ว'}
                                </span>
                              )}
                            </td>
                            {isAdmin && (
                              <td className="p-2 md:p-3 text-center">
                                <input type="number" value={data.amount} onChange={e=>updatePay('amount',e.target.value)} disabled={data.status==='pending'} className={`w-full p-1 md:p-1.5 rounded-lg text-center font-bold border-2 outline-none text-xs md:text-sm ${data.status==='pending'?'bg-gray-100 text-gray-400':'bg-white border-amber-300 text-amber-800'}`} />
                              </td>
                            )}
                          </tr>
                        )
                      })}
                      {students.length === 0 && <tr><td colSpan={isAdmin ? "4" : "3"} className="p-4 text-center text-gray-400 font-bold text-sm">ไม่มีข้อมูลนักเรียน</td></tr>}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>

          {/* Stats Summary */}
          <div className="max-w-6xl mx-auto mt-6 bg-gradient-to-br from-pink-100 to-rose-100 p-4 md:p-10 rounded-[32px] md:rounded-[40px] shadow-lg border-[4px] md:border-[6px] border-white relative overflow-hidden">
             <h3 className="text-xl md:text-3xl font-black mb-4 md:mb-6 text-rose-800 text-center flex flex-col md:flex-row items-center justify-center gap-2 md:gap-3">
               <span className="bg-white p-2 rounded-2xl shadow-sm transform -rotate-6 text-2xl md:text-3xl">🏆</span> 
               สรุปการมาเรียน เดือน{monthNames[currentMonth]}
             </h3>
             {totalClassDaysThisMonth === 0 ? (
               <div className="text-center bg-white/60 p-6 md:p-8 rounded-3xl"><p className="text-base md:text-xl font-bold text-rose-600">ยังไม่มีการจัดตารางเรียนเดือนนี้ค่ะ</p></div>
             ) : (
               <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                 {studentStats.map(stat => (
                   <div key={stat.id} className="bg-white p-4 md:p-6 rounded-[24px] shadow-sm border-[3px] border-rose-100 flex flex-col h-full hover:shadow-md transition">
                     <div className="font-bold text-gray-800 text-base md:text-xl mb-3 md:mb-4 flex justify-between items-center">
                        <span className="truncate pr-2">{stat.name}</span>
                        <span className="shrink-0">{stat.missed===0?'🌟':''}</span>
                     </div>
                     <div className="bg-rose-50 rounded-xl p-3 mb-3 md:mb-4">
                       <div className="flex justify-between items-end mb-2 text-xs md:text-base">
                         <span className="font-bold text-gray-500">รวมเข้าเรียนแล้ว</span>
                         <span className="font-black text-rose-600 text-lg md:text-xl">{stat.attended + stat.makeup}<span className="text-gray-400 text-xs md:text-sm">/{totalClassDaysThisMonth}</span></span>
                       </div>
                       <div className="w-full bg-gray-200 rounded-full h-2 md:h-3 flex overflow-hidden">
                          <div className="bg-green-400 h-full transition-all" style={{width: `${(stat.attended/totalClassDaysThisMonth)*100}%`}}></div>
                          <div className="bg-blue-400 h-full transition-all" style={{width: `${(stat.makeup/totalClassDaysThisMonth)*100}%`}}></div>
                       </div>
                       <div className="flex gap-2 justify-center mt-3 text-[10px] md:text-xs font-bold text-gray-600 bg-white p-1.5 md:p-2 rounded-lg border border-gray-200 flex-wrap">
                          <span>✅ มา: {stat.attended}</span>
                          <span>📘 ชดเชย: {stat.makeup}</span>
                          <span className={stat.missed > 0 ? "text-red-500" : ""}>❌ ขาด: {stat.missed}</span>
                       </div>
                     </div>
                     <div className="mt-auto text-center font-bold text-xs md:text-sm">
                       {stat.missed === 0 ? <span className="inline-block text-green-600 bg-green-50 px-2 py-1 md:px-3 md:py-1.5 rounded-lg border border-green-200 w-full">มาครบ 100% เก่งมาก!</span> : <span className="inline-block text-red-500 bg-red-50 px-2 py-1 md:px-3 md:py-1.5 rounded-lg border border-red-200 w-full">ขาดเรียนไป {stat.missed} วัน</span>}
                     </div>
                   </div>
                 ))}
               </div>
             )}
          </div>

        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
